<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="{{ '/' | relative_url }}" class="brand">Aizen Sosuke<span class="cursor">_</span></a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="https://hackerone.com/aizen-sosuke" target="_blank" rel="noopener">HackerOne</a>
        <a href="https://github.com/hussein113zxc" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>
  <main class="content">
    <div class="wrap">{{ content }}</div>
  </main>
  <footer class="site-footer">
    <div class="wrap"><p>© {{ site.time | date: '%Y' }} Aizen Sosuke · Security Research · Responsible Disclosure</p></div>
  </footer>
</body>
</html>
